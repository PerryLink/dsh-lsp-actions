name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Verify package contents
        run: npm pack --dry-run
      # Publishes the bumped package.json version. Requires the NPM_TOKEN Actions secret (a
      # publish-scoped npm access token). Secrets cannot be tested in a step `if`, so the guard
      # lives in the shell: without the token the step logs a notice and still succeeds, and a
      # tag push without the secret verifies the suite without failing the release.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --provenance
          else
            echo "NPM_TOKEN secret is not set on this repository; skipping npm publish"
          fi
