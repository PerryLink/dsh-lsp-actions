name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test
      - name: Verify package contents
        run: npm pack --dry-run
      # Publishes the bumped package.json version. Requires the NPM_TOKEN Actions secret (a
      # publish-scoped npm access token). Secrets cannot be tested in a step `if`, so the guard
      # lives in the shell: without the token the step logs a notice and still succeeds, and a
      # tag push without the secret verifies the suite without failing the release.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --provenance
          else
            echo "NPM_TOKEN secret is not set on this repository; skipping npm publish"
          fi

  # npm publish alone left every release without a GitHub Release page (v0.5.0
  # had to be created by hand after the fact). This job closes that gap and is
  # idempotent, so re-running a tag is safe.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # A CHANGELOG missing this version's section must not fail the job:
          # npm has already published by now, and a missing Release page is
          # exactly the gap this job exists to close. Fall back to generated
          # notes instead of going red.
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md || true
          if [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
