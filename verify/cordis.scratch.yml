# Local verification overlay: mounts the built plugin from this checkout.
# Run from the plugin repo root (the relative plugin path resolves against the CLI's base URL):
#   pnpm dsh --dump-config --patch ./verify/cordis.scratch.yml
- insert:
    - id: lsp-actions
      name: './lib/index.js'
      inject: [tools, fs, subprocess]
      config:
        servers:
          fixture:
            command: node
            # Machine-specific absolute path: point at this repo's fixture server.
            args: [D:/deepseek-harness/Project/Plugins/dsh-lsp-actions/tests/fixtures/lsp-fixture-server.mjs]
            extensionToLanguage:
              ".ts": typescript
        maxDiagnostics: 200
        maxCompletionItems: 20
        maxCodeActions: 50
        maxSymbols: 100
        maxSignatures: 10
        maxInlayHints: 200
        maxResultChars: 16000
        timeoutMs: 60000
